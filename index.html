<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GIF</title>
<style>
  :root {
    --bg: #ffffff;
    --fg: #111111;
    --muted: #6b6b6b;
    --line: #e4e4e4;
    --soft: #f5f5f5;
    --accent: #2563eb;
    --sel: rgba(37, 99, 235, 0.18);
    --danger: #dc2626;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    font-size: 15px; line-height: 1.5;
  }
  main { max-width: 880px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { font-size: 44px; font-weight: 800; letter-spacing: -0.02em; margin: 0 0 24px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  input[type=url], input[type=number], select {
    font: inherit; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px;
    background: #fff; color: var(--fg); min-width: 0;
  }
  input[type=url] { flex: 1 1 320px; }
  input[type=number] { width: 96px; }
  button {
    font: inherit; padding: 10px 16px; border-radius: 8px; border: 1px solid var(--line);
    background: #fff; color: var(--fg); cursor: pointer; white-space: nowrap;
  }
  button:hover:not(:disabled) { background: var(--soft); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.primary:hover:not(:disabled) { filter: brightness(1.08); background: var(--accent); }
  button:disabled { opacity: .45; cursor: default; }
  .hint { color: var(--muted); font-size: 13px; margin-top: 8px; }
  .msg { margin-top: 12px; font-size: 14px; }
  .msg.err { color: var(--danger); }
  .drop { display: block;
    margin-top: 12px; border: 1.5px dashed var(--line); border-radius: 10px; padding: 14px;
    text-align: center; color: var(--muted); font-size: 14px; cursor: pointer;
  }
  .drop.over { border-color: var(--accent); color: var(--accent); background: var(--sel); }
  section.card { margin-top: 28px; border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
  section.card h2 { font-size: 16px; margin: 0 0 12px; }
  .hidden { display: none !important; }
  video { width: 100%; max-height: 60vh; background: #000; border-radius: 8px; display: block; }

  /* timeline */
  .timeline { position: relative; height: 44px; margin: 16px 0 6px; user-select: none; touch-action: none; }
  .track { position: absolute; left: 0; right: 0; top: 16px; height: 12px; background: var(--soft); border: 1px solid var(--line); border-radius: 6px; }
  .range { position: absolute; top: 16px; height: 12px; background: var(--sel); border-top: 1px solid var(--accent); border-bottom: 1px solid var(--accent); }
  .handle {
    position: absolute; top: 6px; width: 14px; height: 32px; margin-left: -7px; border-radius: 4px;
    background: var(--accent); cursor: ew-resize;
  }
  .playhead { position: absolute; top: 2px; width: 2px; height: 40px; margin-left: -1px; background: var(--fg); pointer-events: none; }
  .times { display: flex; justify-content: space-between; color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }

  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-top: 14px; }
  .field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .field input, .field select { width: 100%; }
  .pair { display: flex; gap: 6px; }
  .pair input { flex: 1; }
  .pair button { padding: 10px; }

  progress { width: 100%; height: 8px; margin-top: 12px; accent-color: var(--accent); }
  #result img { max-width: 100%; border: 1px solid var(--line); border-radius: 8px; display: block; margin: 0 auto; }
  .meta { color: var(--muted); font-size: 13px; margin: 10px 0; text-align: center; }
  #frameCanvas { display: none; }
</style>
</head>
<body>
<main>
  <h1>GIF</h1>

  <form id="urlForm" class="row">
    <input id="urlInput" type="url" placeholder="영상 주소를 입력하세요 (예: https://example.com/video.mp4)" required>
    <button class="primary" type="submit" id="loadBtn">불러오기</button>
  </form>
  <div class="hint" id="hint">mp4 · webm · mov 등 영상 파일 직접 링크를 지원합니다. 서버가 외부 접근(CORS)을 막으면 파일로 올려주세요.</div>
  <label class="drop" id="drop">
    또는 영상 파일을 여기에 끌어다 놓거나 클릭해서 선택
    <input id="fileInput" type="file" accept="video/*" hidden>
  </label>
  <div id="loadMsg" class="msg"></div>

  <section id="editor" class="card hidden">
    <h2>에디터</h2>
    <video id="video" playsinline preload="auto" controls></video>

    <div class="timeline" id="timeline">
      <div class="track"></div>
      <div class="range" id="rangeBar"></div>
      <div class="playhead" id="playhead"></div>
      <div class="handle" id="hStart" title="시작"></div>
      <div class="handle" id="hEnd" title="끝"></div>
    </div>
    <div class="times"><span>0:00.0</span><span id="selInfo"></span><span id="durLabel">0:00.0</span></div>

    <div class="grid">
      <div class="field">
        <label>시작 (초)</label>
        <div class="pair"><input id="startIn" type="number" step="0.1" min="0"><button id="setStart" type="button" title="현재 위치를 시작으로">⇤</button></div>
      </div>
      <div class="field">
        <label>끝 (초)</label>
        <div class="pair"><input id="endIn" type="number" step="0.1" min="0"><button id="setEnd" type="button" title="현재 위치를 끝으로">⇥</button></div>
      </div>
      <div class="field">
        <label>길이 (초)</label>
        <input id="lenIn" type="number" step="0.1" min="0.1">
      </div>
      <div class="field">
        <label>FPS</label>
        <select id="fpsIn">
          <option>5</option><option>8</option><option selected>10</option><option>12</option><option>15</option><option>20</option><option>25</option>
        </select>
      </div>
      <div class="field">
        <label>가로 크기 (px)</label>
        <select id="widthIn">
          <option>240</option><option>320</option><option selected>480</option><option>640</option><option>800</option><option value="0">원본</option>
        </select>
      </div>
      <div class="field">
        <label>반복</label>
        <select id="loopIn"><option value="0" selected>무한 반복</option><option value="-1">한 번만</option></select>
      </div>
    </div>

    <div class="row" style="margin-top:16px">
      <button id="previewBtn" type="button">구간 미리보기</button>
      <button id="makeBtn" class="primary" type="button">GIF 만들기</button>
      <button id="cancelBtn" type="button" class="hidden">취소</button>
    </div>
    <progress id="progress" class="hidden" value="0" max="1"></progress>
    <div id="makeMsg" class="msg"></div>
  </section>

  <section id="result" class="card hidden">
    <h2>결과</h2>
    <img id="gifImg" alt="생성된 GIF">
    <div class="meta" id="gifMeta"></div>
    <div class="row" style="justify-content:center">
      <a id="dlLink" download="clip.gif"><button class="primary" type="button">GIF 다운로드</button></a>
    </div>
  </section>

  <canvas id="frameCanvas"></canvas>
</main>

<script type="module">
import { GIFEncoder, quantize, applyPalette } from 'https://cdn.jsdelivr.net/npm/gifenc@1.0.3/+esm';

const $ = (id) => document.getElementById(id);
const video = $('video');
const MAX_CLIP = 30;          // seconds
const MAX_FRAMES = 600;

let duration = 0, selStart = 0, selEnd = 0;
let objectUrl = null, cancelled = false, busy = false, previewing = false;
let serverMode = false, clipName = '';

// When the page is served by server.js, videos are downloaded by the server
// (YouTube and other sites included) and played same-origin, so CORS never blocks.
fetch('api/health', { cache: 'no-store' })
  .then(r => r.ok ? r.json() : null)
  .then(j => {
    if (!j || !j.ok) return;
    serverMode = true;
    $('urlInput').placeholder = '영상 주소를 입력하세요 (유튜브 등 영상 페이지 또는 영상 파일 링크)';
    $('hint').textContent = '유튜브 · 비메오 · X · 인스타그램 등 대부분의 영상 페이지 주소와 mp4 등 영상 파일 링크를 지원합니다.';
  })
  .catch(() => {});
const safeName = (t) => (t || 'clip').replace(/[\\/:*?"<>|]+/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 80) || 'clip';

const fmt = (t) => {
  t = Math.max(0, t || 0);
  const m = Math.floor(t / 60), s = t - m * 60;
  return `${m}:${s.toFixed(1).padStart(4, '0')}`;
};
const msg = (el, text, err = false) => { el.textContent = text; el.classList.toggle('err', err); };

/* ---------- loading ---------- */
function loadSource(src, isFile) {
  msg($('loadMsg'), '불러오는 중…');
  $('result').classList.add('hidden');
  if (objectUrl && !isFile) { URL.revokeObjectURL(objectUrl); objectUrl = null; }
  if (isFile || src.startsWith('api/')) video.removeAttribute('crossorigin');
  else video.crossOrigin = 'anonymous';
  video.src = src;
  video.load();
}

$('urlForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const url = $('urlInput').value.trim();
  if (!url || busy) return;
  if (serverMode) {
    const btn = $('loadBtn');
    btn.disabled = true;
    msg($('loadMsg'), '서버에서 영상을 받는 중… (영상 길이에 따라 수십 초 걸릴 수 있습니다)');
    try {
      const r = await fetch('api/fetch', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ url }) });
      const j = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(j.error || `서버 오류 (${r.status})`);
      clipName = safeName(j.title);
      loadSource(j.src.replace(/^\//, ''), false);
    } catch (err) {
      msg($('loadMsg'), '영상을 받지 못했습니다: ' + err.message, true);
    } finally {
      btn.disabled = false;
    }
    return;
  }
  clipName = '';
  if (/youtube\.com|youtu\.be|instagram\.com|tiktok\.com|vimeo\.com/i.test(url)) {
    msg($('loadMsg'), '스트리밍 사이트 페이지 주소는 직접 불러올 수 없습니다. 영상 파일(.mp4 등) 직접 링크를 넣거나 파일을 올려주세요.', true);
    return;
  }
  loadSource(url, false);
});

function useFile(file) {
  if (!file || !file.type.startsWith('video/')) { msg($('loadMsg'), '영상 파일을 선택해주세요.', true); return; }
  if (objectUrl) URL.revokeObjectURL(objectUrl);
  objectUrl = URL.createObjectURL(file);
  clipName = safeName(file.name.replace(/\.[^.]+$/, ''));
  loadSource(objectUrl, true);
}
$('fileInput').addEventListener('change', (e) => useFile(e.target.files[0]));
const drop = $('drop');
['dragenter', 'dragover'].forEach(ev => drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.add('over'); }));
['dragleave', 'drop'].forEach(ev => drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.remove('over'); }));
drop.addEventListener('drop', (e) => useFile(e.dataTransfer.files[0]));

video.addEventListener('loadedmetadata', () => {
  duration = video.duration;
  if (!isFinite(duration) || duration <= 0) { msg($('loadMsg'), '영상 길이를 알 수 없습니다.', true); return; }
  selStart = 0;
  selEnd = Math.min(duration, 3);
  $('durLabel').textContent = fmt(duration);
  $('editor').classList.remove('hidden');
  msg($('loadMsg'), `불러오기 완료 · ${video.videoWidth}×${video.videoHeight} · ${fmt(duration)}`);
  let name = clipName;
  if (!name) {
    try { name = safeName(decodeURIComponent(new URL(video.src).pathname.split('/').pop()).replace(/\.[^.]+$/, '')); } catch { name = 'clip'; }
  }
  $('dlLink').download = name + '.gif';
  render();
});
video.addEventListener('error', () => {
  if (video.src.includes('/api/file/')) {
    msg($('loadMsg'), '받은 영상을 브라우저에서 재생할 수 없습니다. 다른 주소로 시도해주세요.', true);
  } else if (video.crossOrigin && video.src && !video.src.startsWith('blob:')) {
    msg($('loadMsg'), '영상을 불러오지 못했습니다. 주소가 영상 파일 직접 링크인지 확인하세요. 해당 서버가 외부 접근(CORS)을 허용하지 않으면 파일을 내려받아 위에 올려주세요.', true);
  } else {
    msg($('loadMsg'), '이 영상 형식은 브라우저에서 재생할 수 없습니다.', true);
  }
});

/* ---------- selection / timeline ---------- */
function clampSel() {
  selStart = Math.max(0, Math.min(selStart, duration));
  selEnd = Math.max(0, Math.min(selEnd, duration));
  if (selEnd < selStart + 0.1) selEnd = Math.min(duration, selStart + 0.1);
  if (selEnd - selStart > MAX_CLIP) selEnd = selStart + MAX_CLIP;
}
function render() {
  clampSel();
  const p = (t) => (duration ? (t / duration) * 100 : 0) + '%';
  $('hStart').style.left = p(selStart);
  $('hEnd').style.left = p(selEnd);
  $('rangeBar').style.left = p(selStart);
  $('rangeBar').style.width = `calc(${p(selEnd)} - ${p(selStart)})`;
  $('playhead').style.left = p(video.currentTime);
  const len = selEnd - selStart;
  $('selInfo').textContent = `${fmt(selStart)} – ${fmt(selEnd)} (${len.toFixed(1)}초)`;
  if (document.activeElement !== $('startIn')) $('startIn').value = selStart.toFixed(1);
  if (document.activeElement !== $('endIn')) $('endIn').value = selEnd.toFixed(1);
  if (document.activeElement !== $('lenIn')) $('lenIn').value = len.toFixed(1);
  $('startIn').max = $('endIn').max = duration.toFixed(1);
}
video.addEventListener('timeupdate', () => {
  if (previewing && video.currentTime >= selEnd) video.currentTime = selStart;
  $('playhead').style.left = (video.currentTime / duration) * 100 + '%';
});

const timeline = $('timeline');
let drag = null;
const timeAt = (x) => {
  const r = timeline.getBoundingClientRect();
  return Math.max(0, Math.min(1, (x - r.left) / r.width)) * duration;
};
timeline.addEventListener('pointerdown', (e) => {
  if (!duration || busy) return;
  const t = timeAt(e.clientX);
  if (e.target.id === 'hStart') drag = 'start';
  else if (e.target.id === 'hEnd') drag = 'end';
  else if (t > selStart && t < selEnd) drag = { move: t - selStart };
  else drag = Math.abs(t - selStart) < Math.abs(t - selEnd) ? 'start' : 'end';
  timeline.setPointerCapture(e.pointerId);
  onDrag(e);
});
timeline.addEventListener('pointermove', (e) => drag && onDrag(e));
timeline.addEventListener('pointerup', () => { drag = null; });
timeline.addEventListener('pointercancel', () => { drag = null; });
function onDrag(e) {
  const t = timeAt(e.clientX);
  if (drag === 'start') { selStart = Math.min(t, selEnd - 0.1); seek(selStart); }
  else if (drag === 'end') { selEnd = Math.max(t, selStart + 0.1); if (selEnd - selStart > MAX_CLIP) selStart = selEnd - MAX_CLIP; seek(selEnd); }
  else {
    const len = selEnd - selStart;
    selStart = Math.max(0, Math.min(duration - len, t - drag.move));
    selEnd = selStart + len;
    seek(selStart);
  }
  render();
}
function seek(t) { if (!previewing) video.currentTime = t; }

$('startIn').addEventListener('change', (e) => { selStart = +e.target.value || 0; render(); seek(selStart); });
$('endIn').addEventListener('change', (e) => { selEnd = +e.target.value || 0; render(); seek(selEnd); });
$('lenIn').addEventListener('change', (e) => { selEnd = selStart + Math.max(0.1, +e.target.value || 0.1); render(); });
$('setStart').addEventListener('click', () => { selStart = video.currentTime; if (selEnd <= selStart) selEnd = selStart + 3; render(); });
$('setEnd').addEventListener('click', () => { selEnd = video.currentTime; if (selEnd <= selStart) selStart = Math.max(0, selEnd - 3); render(); });

$('previewBtn').addEventListener('click', () => {
  if (previewing) { stopPreview(); return; }
  previewing = true;
  $('previewBtn').textContent = '미리보기 정지';
  video.currentTime = selStart;
  video.play();
});
function stopPreview() {
  previewing = false;
  video.pause();
  $('previewBtn').textContent = '구간 미리보기';
}

/* ---------- GIF encoding ---------- */
function seekTo(t) {
  return new Promise((resolve, reject) => {
    const done = () => { video.removeEventListener('seeked', done); clearTimeout(timer); resolve(); };
    const timer = setTimeout(() => { video.removeEventListener('seeked', done); reject(new Error('seek timeout')); }, 15000);
    video.addEventListener('seeked', done);
    video.currentTime = t;
  });
}

$('cancelBtn').addEventListener('click', () => { cancelled = true; });

$('makeBtn').addEventListener('click', async () => {
  if (busy || !duration) return;
  stopPreview();
  busy = true; cancelled = false;
  $('makeBtn').disabled = $('previewBtn').disabled = true;
  $('cancelBtn').classList.remove('hidden');
  const prog = $('progress');
  prog.classList.remove('hidden'); prog.value = 0;

  const fps = +$('fpsIn').value;
  const wantW = +$('widthIn').value;
  const vw = video.videoWidth, vh = video.videoHeight;
  const w = wantW && wantW < vw ? wantW : vw;
  const h = Math.max(1, Math.round((vh * w) / vw));
  const total = Math.min(MAX_FRAMES, Math.max(1, Math.round((selEnd - selStart) * fps)));
  const delay = Math.round(1000 / fps);
  const canvas = $('frameCanvas');
  canvas.width = w; canvas.height = h;
  const ctx = canvas.getContext('2d', { willReadFrequently: true });
  const gif = GIFEncoder();

  try {
    for (let i = 0; i < total; i++) {
      if (cancelled) throw new Error('cancelled');
      await seekTo(Math.min(selStart + i / fps, duration - 0.001));
      ctx.drawImage(video, 0, 0, w, h);
      const { data } = ctx.getImageData(0, 0, w, h);
      const palette = quantize(data, 256);
      const index = applyPalette(data, palette);
      gif.writeFrame(index, w, h, { palette, delay, repeat: +$('loopIn').value });
      prog.value = (i + 1) / total;
      msg($('makeMsg'), `프레임 ${i + 1} / ${total} 변환 중…`);
      if (i % 4 === 0) await new Promise(r => setTimeout(r));
    }
    gif.finish();
    const blob = new Blob([gif.bytes()], { type: 'image/gif' });
    const url = URL.createObjectURL(blob);
    const old = $('gifImg').src;
    if (old.startsWith('blob:')) URL.revokeObjectURL(old);
    $('gifImg').src = url;
    $('dlLink').href = url;
    $('gifMeta').textContent = `${w}×${h} · ${total}프레임 · ${fps}fps · ${(selEnd - selStart).toFixed(1)}초 · ${(blob.size / 1024 / 1024).toFixed(2)}MB`;
    $('result').classList.remove('hidden');
    msg($('makeMsg'), 'GIF 생성 완료!');
    $('result').scrollIntoView({ behavior: 'smooth', block: 'start' });
  } catch (err) {
    if (err.message === 'cancelled') msg($('makeMsg'), '취소되었습니다.');
    else if (err.name === 'SecurityError') msg($('makeMsg'), '이 영상 서버가 외부 접근(CORS)을 허용하지 않아 프레임을 읽을 수 없습니다. 파일을 내려받아 올려주세요.', true);
    else msg($('makeMsg'), '변환 중 오류: ' + err.message, true);
  } finally {
    busy = false;
    $('makeBtn').disabled = $('previewBtn').disabled = false;
    $('cancelBtn').classList.add('hidden');
    prog.classList.add('hidden');
    video.currentTime = selStart;
  }
});
</script>
</body>
</html>
